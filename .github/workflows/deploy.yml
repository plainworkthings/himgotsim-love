name: Deploy himgotsim.love from the main wedding repo
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: plainworkthings/himanshu-weds-simran
          ref: main
          path: site
      - id: check
        name: Skip if the live site already has this commit
        run: |
          sha=$(git -C site rev-parse HEAD)
          live=$(curl -fsS --max-time 15 "https://himgotsim.love/deployed-sha.txt?t=$(date +%s)" || true)
          echo "main=$sha live=$live"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$sha" = "$live" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf site/.git site/.github
          echo "himgotsim.love" > site/CNAME
          echo "$sha" > site/deployed-sha.txt
      - if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.check.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
